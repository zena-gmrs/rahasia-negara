<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujian Evaluasi Hubungan Romantis ✨💖</title>
  
  <!-- Google Fonts: Poppins & Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            poppins: ['"Poppins"', 'sans-serif'],
            quicksand: ['"Quicksand"', 'sans-serif'],
          },
          colors: {
            love: {
              50: '#fff0f3',
              100: '#ffccd5',
              200: '#ffb3c1',
              300: '#ff8fa3',
              400: '#ff758c',
              500: '#ff4d6d',
              600: '#c9184a',
            }
          },
          animation: {
            'bounce-slow': 'bounce 3s infinite',
            'float': 'float 4s ease-in-out infinite',
            'pop-in': 'popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-8px)' },
            },
            popIn: {
              '0%': { opacity: '0', transform: 'scale(0.85)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: linear-gradient(135deg, #ffdee9 0%, #b5fffc 100%);
      background-attachment: fixed;
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Glassmorphism card container */
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 20px 40px -10px rgba(255, 77, 109, 0.25);
    }

    /* Quiz Option button effect */
    .quiz-opt {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .quiz-opt:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.2);
    }
    .quiz-opt:active {
      transform: translateY(1px) scale(0.99);
    }

    /* Certificate stamp badge */
    .stamp {
      transform: rotate(-12deg);
      box-shadow: 0 0 0 3px #c9184a, 0 0 0 6px rgba(201, 24, 74, 0.3);
    }
  </style>
</head>

<body class="flex flex-col items-center justify-center p-4 sm:p-6 min-h-screen">

  <!-- Background decorative floating elements -->
  <div class="fixed top-10 left-8 text-4xl animate-float opacity-70 pointer-events-none select-none">💖</div>
  <div class="fixed bottom-12 right-8 text-4xl animate-float opacity-70 pointer-events-none select-none" style="animation-delay: 1.5s;">🌸</div>
  <div class="fixed top-1/3 right-12 text-3xl animate-float opacity-60 pointer-events-none select-none" style="animation-delay: 2.5s;">✨</div>

  <!-- Main Card Container -->
  <main class="w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 relative overflow-hidden z-10 transition-all duration-500">
    
    <!-- Top Header & Progress Bar -->
    <header class="mb-6">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-extrabold uppercase tracking-widest text-love-600 bg-love-50 px-3 py-1 rounded-full border border-love-100">
          📋 Ujian Resmi Hubungan
        </span>
        <span id="progress-text" class="text-xs font-bold text-gray-500">Soal 1 dari 4</span>
      </div>

      <!-- Interactive Progress Bar -->
      <div class="w-full bg-gray-100 rounded-full h-3 overflow-hidden p-0.5 border border-pink-100 shadow-inner">
        <div id="progress-bar" class="bg-gradient-to-r from-love-400 to-love-600 h-full rounded-full transition-all duration-500 ease-out" style="width: 25%;"></div>
      </div>
    </header>

    <!-- Dynamic Quiz Container -->
    <div id="quiz-body" class="animate-pop-in">
      <!-- Question title -->
      <div class="flex items-start gap-3 mb-5">
        <span id="question-emoji" class="text-3xl sm:text-4xl">🤔</span>
        <div>
          <h2 id="question-title" class="font-poppins font-bold text-gray-800 text-lg sm:text-xl leading-snug">
            Loading...
          </h2>
          <p id="question-desc" class="text-xs text-gray-400 mt-1">Pilih salah satu jawaban yang paling jujur ya!</p>
        </div>
      </div>

      <!-- Options List -->
      <div id="options-container" class="space-y-3 mb-6 relative min-h-[220px]">
        <!-- Dynamically filled via JavaScript -->
      </div>
    </div>

    <!-- Footer Note / Disclaimer -->
    <footer class="text-center pt-3 border-t border-pink-100">
      <p class="text-[11px] text-gray-400 font-medium">
        🔒 *Sistem ujian terenkripsi cinta 100%. Tidak ada jawaban salah.*
      </p>
    </footer>

  </main>

  <!-- Notification Toast for Dodger Button -->
  <div id="toast-msg" class="fixed bottom-6 bg-gray-900/90 backdrop-blur text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-2xl transition-all duration-300 opacity-0 transform translate-y-4 pointer-events-none z-50 flex items-center gap-2">
    <span>🤪</span> <span id="toast-text">Ups, tombol ini rusak!</span>
  </div>

  <script>
    /* ==========================================================
       QUIZ DATA & STATE
       ========================================================== */
    const quizData = [
      {
        emoji: "🧐",
        question: "Soal #1: Siapa sih orang paling gemes & bikin kangen yang sering nge-chat kamu tiap hari?",
        options: [
          { letter: "A", text: "Orang yang ngirim kuis ini 🤭", valid: true },
          { letter: "B", text: "Si pengirim kuis yang lucu ini 💖", valid: true },
          { letter: "C", text: "Pilihan A & B benar banget!", valid: true },
          { letter: "D", text: "Pokoknya kamu lah, masa orang lain! ✨", valid: true }
        ]
      },
      {
        emoji: "💭",
        question: "Soal #2: Menurut kamu, kegiatan paling seru dan gak pernah bikin bosen itu apa?",
        options: [
          { letter: "A", text: "Chattingan & telponan bareng kamu", valid: true },
          { letter: "B", text: "Jalan-jalan & jajan bareng kamu", valid: true },
          { letter: "C", text: "Mikirin kamu pas lagi gabut", valid: true },
          { letter: "D", text: "Semua pilihan di atas Wajib 100%! 💯", valid: true }
        ]
      },
      {
        emoji: "🍕",
        question: "Soal #3: Kalau kita lagi nongkrong bareng, siapa yang bakal paling sering senyum sendiri?",
        options: [
          { letter: "A", text: "Kamu, soalnya aku lucu banget 😜", valid: true },
          { letter: "B", text: "Aku, karena seneng dideket kamu 🥰", valid: true },
          { letter: "C", text: "Dua-duanya senyum barengan! 🌸", valid: true },
          { letter: "D", text: "Pasti kita berdua bahagia banget ✨", valid: true }
        ]
      },
      {
        emoji: "💌",
        isFinal: true,
        question: "Soal Final: Apakah kamu bersedia secara sadar & bahagia untuk jadi PACARKU?",
        options: [
          { letter: "A", text: "Mau banget dong! ❤️", valid: true },
          { letter: "B", text: "Mau aja deh 🥰", valid: true },
          { letter: "C", text: "Jelas Pilihan A 100%! ✨", valid: true },
          { letter: "D", text: "Mengesahkan Pilihan B! 🎉", valid: true }
        ]
      }
    ];

    let currentStep = 0;

    /* ==========================================================
       UI RENDER LOGIC
       ========================================================== */
    function renderStep() {
      const currentQuiz = quizData[currentStep];
      const totalSteps = quizData.length;

      // Update Header Progress
      document.getElementById('progress-text').innerText = `Soal ${currentStep + 1} dari ${totalSteps}`;
      const progressPercent = ((currentStep + 1) / totalSteps) * 100;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;

      // Update Question Content
      document.getElementById('question-emoji').innerText = currentQuiz.emoji;
      document.getElementById('question-title').innerText = currentQuiz.question;
      
      const descEl = document.getElementById('question-desc');
      if (currentQuiz.isFinal) {
        descEl.innerText = "⚠️ Peringatan: Pilihan jawaban di bawah ini akan mengubah status kamu!";
        descEl.className = "text-xs font-bold text-love-600 mt-1";
      } else {
        descEl.innerText = "Pilih salah satu jawaban yang paling jujur ya!";
        descEl.className = "text-xs text-gray-400 mt-1";
      }

      // Render Options
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      currentQuiz.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = `quiz-opt w-full text-left p-3.5 sm:p-4 rounded-2xl border-2 border-pink-100 bg-white hover:border-love-300 hover:bg-love-50/50 text-gray-700 font-semibold text-sm sm:text-base flex items-center gap-3 shadow-sm`;
        btn.onclick = () => handleAnswerSelect();

        btn.innerHTML = `
          <span class="w-8 h-8 rounded-xl bg-love-100 text-love-600 font-poppins font-bold flex items-center justify-center text-sm shrink-0">
            ${opt.letter}
          </span>
          <span class="flex-grow">${opt.text}</span>
        `;
        container.appendChild(btn);
      });

      // Add sneaky "Nggak Mau" dodge button ONLY on final question
      if (currentQuiz.isFinal) {
        const dodgeBtn = document.createElement('button');
        dodgeBtn.id = 'btn-dodge';
        dodgeBtn.className = 'absolute text-[11px] font-bold text-gray-400 bg-gray-100 hover:bg-gray-200 border border-gray-200 px-3 py-1.5 rounded-full shadow-sm transition-all duration-200';
        dodgeBtn.style.bottom = '-10px';
        dodgeBtn.style.right = '0px';
        dodgeBtn.innerText = 'Nggak mau 😜';

        // Attach dodge triggers
        dodgeBtn.onmouseover = dodgeAction;
        dodgeBtn.onclick = dodgeAction;
        dodgeBtn.ontouchstart = (e) => { e.preventDefault(); dodgeAction(); };

        container.appendChild(dodgeBtn);
      }
    }

    /* ==========================================================
       NEXT STEP & DODGER BUTTON HANDLERS
       ========================================================== */
    function handleAnswerSelect() {
      // Smooth animation transition out
      const bodyEl = document.getElementById('quiz-body');
      bodyEl.classList.remove('animate-pop-in');
      bodyEl.style.opacity = '0';
      bodyEl.style.transform = 'scale(0.95)';

      setTimeout(() => {
        if (currentStep < quizData.length - 1) {
          currentStep++;
          renderStep();
          bodyEl.style.opacity = '1';
          bodyEl.style.transform = 'scale(1)';
          bodyEl.classList.add('animate-pop-in');
        } else {
          showResultCertificate();
        }
      }, 250);
    }

    let dodgeCount = 0;
    const dodgeTexts = [
      "Ups, tombol ini rusak! Pilih A/B/C/D aja ya 🤪",
      "Eits meleset! Nggak bisa diklik wkkww 🏃‍♂️",
      "Sistem menolak tombol ini! Harus terima! ❤️",
      "Ehh mau kabur kemana? Klik pilihan atas aja! 🥰",
      "Tombol penolakan sudah kadaluarsa! ❌"
    ];

    function dodgeAction() {
      const btn = document.getElementById('btn-dodge');
      if (!btn) return;

      dodgeCount++;
      
      // Random coordinates inside options container boundaries
      const randomX = (Math.random() * 240) - 120;
      const randomY = (Math.random() * 140) - 70;

      btn.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${Math.random() * 20 - 10}deg)`;

      // Show humorous Toast Message
      const toastText = dodgeTexts[(dodgeCount - 1) % dodgeTexts.length];
      showToast(toastText);
    }

    function showToast(text) {
      const toast = document.getElementById('toast-msg');
      document.getElementById('toast-text').innerText = text;
      
      toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2200);
    }

    /* ==========================================================
       FINAL RESULT & CERTIFICATE GENERATOR
       ========================================================= */
    function showResultCertificate() {
      // Trigger Confetti Explosion
      triggerConfetti();

      const mainCard = document.querySelector('main');
      mainCard.innerHTML = `
        <div class="text-center animate-pop-in">
          <!-- Top Badge -->
          <div class="inline-block bg-emerald-100 text-emerald-700 font-extrabold text-xs px-4 py-1 rounded-full mb-3 border border-emerald-200">
            🎉 UJIAN SELESAI & LULUS 100%
          </div>

          <!-- Title -->
          <h1 class="font-poppins font-extrabold text-2xl sm:text-3xl text-gray-800 mb-1">
            Sertifikat Hubungan Resmi 📜
          </h1>
          <p class="text-xs text-gray-400 mb-5">Diterbitkan oleh Sistem Cinta Terpercaya</p>

          <!-- Result Certificate Card -->
          <div class="bg-gradient-to-b from-love-50/80 to-white p-5 rounded-2xl border-2 border-love-200 text-left mb-6 shadow-inner relative overflow-hidden">
            
            <!-- Stamp Badge -->
            <div class="absolute top-3 right-3 stamp bg-love-600 text-white font-poppins font-black text-[10px] px-2.5 py-1 rounded border-2 border-white tracking-widest uppercase">
              LULUS PACARAN
            </div>

            <!-- Score -->
            <div class="mb-4">
              <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block">NILAI AKHIR:</span>
              <span class="font-poppins font-black text-4xl text-love-600">100/100 <span class="text-2xl text-love-500">(A+)</span></span>
            </div>

            <!-- Status & Message -->
            <div class="space-y-2 text-xs sm:text-sm text-gray-700 leading-relaxed font-medium">
              <p>
                <strong class="text-gray-900">Selamat!</strong> Pilihan kamu tepat 100%! Sistem secara otomatis mencatat bahwa kita <strong class="text-love-600">RESMI BERPACARAN</strong> mulai detik ini. ✨
              </p>
              <p class="bg-white/80 p-3 rounded-xl border border-pink-100 text-pink-700 font-semibold text-xs italic">
                "Garansi seumur hidup, penuh kasih sayang, selalu ada waktu buat kamu & NO REFUND ya! 💖"
              </p>
            </div>
          </div>

          <!-- WhatsApp Share Button -->
          <button onclick="sendWhatsApp()" class="w-full font-poppins font-bold bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white text-base py-3.5 px-6 rounded-2xl shadow-xl transform hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2 mb-3">
            <span>💬 Kirim Bukti ke WhatsApp</span>
          </button>

          <!-- Restart button -->
          <button onclick="location.reload()" class="text-xs font-bold text-gray-400 hover:text-love-500 transition-colors">
            ↺ Ulangi Kuis Dari Awal
          </button>
        </div>
      `;
    }

    /* ==========================================================
       CONFETTI SHOWER & WHATSAPP INTEGRATION
       ========================================================== */
    function triggerConfetti() {
      const duration = 3 * 1000;
      const animationEnd = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 7,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#ff4d6d', '#ff758c', '#ffccd5', '#ffffff', '#34d399']
        });
        confetti({
          particleCount: 7,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#ff4d6d', '#ff758c', '#ffccd5', '#ffffff', '#34d399']
        });

        if (Date.now() < animationEnd) {
          requestAnimationFrame(frame);
        }
      })();
    }

    function sendWhatsApp() {
      const message = encodeURIComponent(
        "Halo! 💖 Aku udah selesai ngerjain Ujian Evaluasi Hubungan nih.\n\n" +
        "📊 Hasil Nilai: 100/100 (A+)\n" +
        "📜 Status: LULUS RESMI JADI PACAR KAMU! 🎉\n\n" +
        "Mulai hari ini no refund ya, pokoknya traktir aku jajan! 🥰✨"
      );
      
      // Open WhatsApp directly
      window.open(`https://api.whatsapp.com/send?text=${message}`, '_blank');
    }

    // Initialize first question on load
    renderStep();
  </script>
</body>
</html>
